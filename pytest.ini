[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers
markers =
    multi_hpu: marks tests as requiring multiple HPUs (skip with '-m "not multi_hpu"')
    slow: marks tests as slow running (skip with '-m "not slow"')

# Default options
addopts = -v --tb=short

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
